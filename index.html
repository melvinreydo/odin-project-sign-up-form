<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main-page">
    <div class="left-section">
      <div class="title">
        <img src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png">
        <p>
          ODIN
        </p>
      </div>
      <p class="credit">Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA" target="_blank">Unsplash</a></p>
    </div>
    <div class="right-section">
      <div>
        <h1>
        This is not a real online service! You know you need something like this in your life
        to help you realize your deepest dreams. </br>Sign up <i>now</i> to get started.
        </h1>
        <h1>
        You <i>know</i> you want to.
        </h1>
      </div>
        <form>
          <section class="form">
            <h1>Let's do this!</h1>
            <div class="form-lists">
              <div>
                <label for="first-name">FIRST NAME</label>
                <input required type="text" placeholder="John" id="first-name" name="first-name">
              </div>
              <div>
                <label for="last-name">LAST NAME</label>
                <input required type="text" placeholder="Doe" id="last-name" name="last-name">
              </div>
              <div>
                <label for="email">EMAIL</label>
                <input required type="email" placeholder="example@email.com" id="email" name="email">
              </div>
              <div>
                <label for="phone-number">PHONE NUMBER</label>
                <input required type="text" placeholder="+1234567890" id="first-name" name="first-name">
              </div>
              <div>
                <label for="password">PASSWORD</label>
                <input required type="text" placeholder="Enter password" id="password" name="password">
              </div>
              <div>
                <label for="confirm-password">CONFIRM PASSWORD</label>
                <input required type="text" placeholder="Enter the same password" id="confirm-password" name="confirm-password">
              </div>
          </section>
          <button type="submit">Create Account</button>
          <p>Already have an account? <a>Log in</a></p>
        </form>
    </div>
  </div>
</body>
</html>
